<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="settings.css" />
    <title>Kangaroo</title>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <h1>Kangaroo</h1>
        <div class="top-actions">
          <div class="lang-switch" id="language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="zh">中文</button>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoStart" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span data-i18n="autoStart">Start with Windows</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="enabled" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span data-i18n="enabled">Enabled</span>
          </label>
          <button id="reset" class="button ghost" type="button" data-i18n="reset">Reset</button>
        </div>
      </header>

      <section class="preview-card">
        <canvas id="preview"></canvas>
        <div class="preview-foot">
          <span class="preview-label" data-i18n="preview">Preview</span>
          <button id="play" class="button small" type="button" data-i18n="replay">Replay</button>
        </div>
      </section>

      <section>
        <h2 data-i18n="speed">Speed</h2>
        <div class="card speed-card">
          <div class="fields">
            <label class="field">
              <span class="field-head">
                <span data-i18n="speedStart">Start</span>
                <output id="min-speed-out"></output>
              </span>
              <input id="min-speed" type="range" min="100" max="5000" step="50" />
            </label>
            <label class="field">
              <span class="field-head">
                <span data-i18n="speedFull">Full</span>
                <output id="max-speed-out"></output>
              </span>
              <input id="max-speed" type="range" min="200" max="12000" step="100" />
            </label>
          </div>
          <canvas id="speed-curve" class="curve-canvas"></canvas>
          <div class="curve-row">
            <code id="speed-curve-value" class="curve-value"></code>
            <select id="speed-preset" class="preset"></select>
          </div>
          <div class="speed-foot">
            <span id="speed-live" class="speed-live"></span>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="pointer">Pointer</h2>
        <div class="card pointer-card">
          <canvas id="pointer"></canvas>
          <div class="pointer-foot">
            <div class="swatches" id="swatches"></div>
            <label class="opacity-control">
              <span data-i18n="opacity">Opacity</span>
              <input id="opacity" type="range" min="0.2" max="1" step="0.05" />
              <output id="opacity-out"></output>
            </label>
            <span id="pointer-meta" class="pointer-meta"></span>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="growAnimation">Grow animation</h2>
        <div id="grow-card"></div>
      </section>

      <section>
        <h2 data-i18n="shrinkAnimation">Shrink animation</h2>
        <div id="shrink-card"></div>
      </section>
    </div>

    <template id="anim-template">
      <div class="card anim-card">
        <div class="anim-top">
          <div class="segmented">
            <button type="button" data-mode="bezier" data-i18n="curve">Curve</button>
            <button type="button" data-mode="spring" data-i18n="spring">Spring</button>
          </div>
          <select class="preset"></select>
        </div>
        <div class="bezier-panel">
          <canvas class="curve-canvas"></canvas>
          <div class="curve-row">
            <code class="curve-value"></code>
            <label class="field inline">
              <span class="field-head">
                <span data-i18n="duration">Duration</span>
                <output class="ms-out"></output>
              </span>
              <input class="ms-range" type="range" min="60" max="1200" step="10" />
            </label>
          </div>
        </div>
        <div class="spring-panel" hidden>
          <canvas class="spring-canvas"></canvas>
          <div class="fields three">
            <label class="field">
              <span class="field-head">
                <span data-i18n="stiffness">Stiffness</span>
                <output data-out="stiffness"></output>
              </span>
              <input type="range" data-input="stiffness" min="40" max="1200" step="10" />
            </label>
            <label class="field">
              <span class="field-head">
                <span data-i18n="damping">Damping</span>
                <output data-out="damping"></output>
              </span>
              <input type="range" data-input="damping" min="2" max="80" step="1" />
            </label>
            <label class="field">
              <span class="field-head">
                <span data-i18n="mass">Mass</span>
                <output data-out="mass"></output>
              </span>
              <input type="range" data-input="mass" min="0.2" max="3" step="0.1" />
            </label>
          </div>
        </div>
      </div>
    </template>

    <script src="../shared/curves.js"></script>
    <script src="../shared/cursor-sprite.js"></script>
    <script src="../shared/cursor-anim.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
